<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>RAG Assistant Login</mat-card-title>
      <mat-card-subtitle>Enter your API key to continue</mat-card-subtitle>
    </mat-card-header>
    
    <mat-card-content>
      <form (ngSubmit)="login()">
        <mat-form-field class="full-width">
          <mat-label>API Key</mat-label>
          <input 
            matInput 
            type="password" 
            [(ngModel)]="apiKey" 
            name="apiKey" 
            required
            [disabled]="isSubmitting"
            placeholder="Enter your API key">
        </mat-form-field>
      </form>
    </mat-card-content>
    
    <mat-card-actions>
      <button 
        mat-raised-button 
        color="primary" 
        (click)="login()" 
        [disabled]="isSubmitting">
        {{ isSubmitting ? 'Logging in...' : 'Login' }}
      </button>
    </mat-card-actions>
  </mat-card>
</div>
